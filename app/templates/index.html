<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>smart-home · operator console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
  <style>
    :root {
      --bg-deep: #0a0a0c;
      --surface: #111114;
      --surface-hi: #16161a;
      --surface-hover: #1a1a1f;
      --hairline: #1f1f23;
      --hairline-hi: #2a2a2f;
      --text-primary: #e5e5e7;
      --text-secondary: #8a8a92;
      --text-mute: #555560;
      --green: #22c55e;
      --green-dim: #15803d;
      --red: #ef4444;
      --red-dim: #991b1b;
      --amber: #f59e0b;
      --blue: #3b82f6;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --space-6: 32px;
      --radius: 2px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: var(--bg-deep);
      color: var(--text-primary);
      font-family: 'Geist', system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    code, .mono, .meta-value, .meta-label, .device-readout, .room-label, .footer-label {
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    /* ============ TOP STATUS BAR ============ */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--surface);
      border-bottom: 1px solid var(--hairline);
      padding: var(--space-3) var(--space-5);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-5);
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: var(--space-3);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
    }

    .brand-mark {
      color: var(--green);
      font-weight: 500;
    }

    .brand-name {
      color: var(--text-primary);
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .brand-tag {
      color: var(--text-mute);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .status-meta {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-secondary);
      flex-wrap: wrap;
    }

    .meta-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .meta-label {
      color: var(--text-mute);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-size: 10px;
    }

    .meta-value {
      color: var(--text-primary);
      font-weight: 500;
    }

    .meta-sep {
      color: var(--hairline-hi);
    }

    /* ============ PIP INDICATORS ============ */
    .pip {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-mute);
      flex-shrink: 0;
      vertical-align: middle;
    }

    .pip[data-state="on"], .pip[data-state="live"], .pip[data-state="connected"] {
      background: var(--green);
      box-shadow: 0 0 6px rgba(34, 197, 94, 0.6);
      animation: pulse-green 2s ease-in-out infinite;
    }

    .pip[data-state="off"] {
      background: var(--text-mute);
    }

    .pip[data-state="alert"], .pip[data-state="disconnected"] {
      background: var(--red);
      box-shadow: 0 0 6px rgba(239, 68, 68, 0.6);
    }

    .pip[data-state="motion"], .pip[data-state="warn"] {
      background: var(--amber);
      box-shadow: 0 0 6px rgba(245, 158, 11, 0.6);
      animation: pulse-amber 1.2s ease-in-out infinite;
    }

    .pip[data-state="active"], .pip[data-state="auto"], .pip[data-state="cooling"], .pip[data-state="heating"] {
      background: var(--blue);
    }

    @keyframes pulse-green {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }

    @keyframes pulse-amber {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* ============ MAIN LAYOUT ============ */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: var(--space-6) var(--space-5);
    }

    .room-group {
      margin-bottom: var(--space-6);
    }

    .room-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: var(--space-2) 0;
      margin-bottom: var(--space-2);
      border-bottom: 1px solid var(--hairline);
    }

    .room-label {
      color: var(--text-secondary);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 500;
    }

    .room-meta {
      color: var(--text-mute);
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* ============ DEVICE ROWS ============ */
    .device-row {
      display: grid;
      grid-template-columns: 16px minmax(0, 1.6fr) minmax(0, 1.4fr) auto;
      align-items: center;
      gap: var(--space-4);
      padding: var(--space-3) var(--space-3);
      border-bottom: 1px solid var(--hairline);
      transition: background-color 120ms ease;
    }

    .device-row:hover {
      background: var(--surface-hi);
    }

    .device-row:last-child {
      border-bottom: none;
    }

    .device-name {
      color: var(--text-primary);
      font-weight: 500;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .device-readout {
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 400;
    }

    .device-readout .accent-on { color: var(--green); }
    .device-readout .accent-off { color: var(--text-mute); }
    .device-readout .accent-alert { color: var(--amber); }

    .device-control {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      justify-content: flex-end;
    }

    /* ============ CONTROLS ============ */
    .toggle {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--hairline-hi);
      padding: 4px 10px;
      border-radius: var(--radius);
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      min-width: 48px;
      transition: all 120ms ease;
    }

    .toggle[data-state="on"] {
      color: var(--green);
      border-color: var(--green-dim);
      background: rgba(34, 197, 94, 0.06);
    }

    .toggle[data-state="off"] {
      color: var(--text-mute);
    }

    .toggle:hover {
      border-color: var(--text-secondary);
      color: var(--text-primary);
    }

    .toggle[data-state="on"]:hover {
      border-color: var(--green);
    }

    .slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100px;
      height: 2px;
      background: var(--hairline-hi);
      outline: none;
      cursor: pointer;
    }

    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      background: var(--text-primary);
      border: 1px solid var(--bg-deep);
      cursor: pointer;
    }

    .slider::-moz-range-thumb {
      width: 12px;
      height: 12px;
      background: var(--text-primary);
      border: 1px solid var(--bg-deep);
      cursor: pointer;
      border-radius: 0;
    }

    /* ============ HONESTY FOOTER ============ */
    .reality-card {
      margin-top: var(--space-6);
      padding: var(--space-4) var(--space-5);
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-left: 2px solid var(--amber);
    }

    .footer-label {
      display: block;
      color: var(--amber);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: var(--space-2);
    }

    .reality-card p {
      color: var(--text-secondary);
      font-size: 12px;
      line-height: 1.6;
    }

    .reality-card p + p {
      margin-top: var(--space-2);
    }

    .reality-card strong {
      color: var(--text-primary);
      font-weight: 500;
    }

    /* ============ LOADING / EMPTY ============ */
    .empty {
      padding: var(--space-6);
      color: var(--text-mute);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      text-align: center;
    }

    /* ============ RESPONSIVE ============ */
    @media (max-width: 720px) {
      .topbar {
        padding: var(--space-3) var(--space-4);
        gap: var(--space-3);
      }
      .status-meta {
        gap: var(--space-3);
        font-size: 10px;
      }
      .meta-sep { display: none; }
      main {
        padding: var(--space-5) var(--space-3);
      }
      .device-row {
        grid-template-columns: 14px minmax(0, 1fr) auto;
        gap: var(--space-3);
        padding: var(--space-3) var(--space-2);
      }
      .device-readout {
        grid-column: 2 / 4;
        font-size: 11px;
        margin-top: -4px;
      }
      .device-control {
        grid-column: 1 / 4;
        justify-content: flex-end;
        margin-top: var(--space-1);
      }
      .slider { width: 80px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">[⎈]</span>
      <span class="brand-name">smart-home</span>
      <span class="brand-tag">// operator console</span>
    </div>
    <div class="status-meta">
      <span class="meta-item">
        <span class="pip" id="brokerPip" data-state="off"></span>
        <span class="meta-label">broker</span>
        <span class="meta-value" id="brokerStatus">offline · sim</span>
      </span>
      <span class="meta-sep">·</span>
      <span class="meta-item">
        <span class="meta-value" id="deviceCount">0</span>
        <span class="meta-label">devices</span>
      </span>
      <span class="meta-sep">·</span>
      <span class="meta-item">
        <span class="meta-value" id="energyValue">0.00</span>
        <span class="meta-label">kW</span>
      </span>
      <span class="meta-sep">·</span>
      <span class="meta-item">
        <span class="meta-label">NY</span>
        <span class="meta-value" id="clock">--:--</span>
      </span>
      <span class="meta-sep">·</span>
      <span class="meta-item">
        <span class="pip" id="connPip" data-state="off"></span>
        <span class="meta-label" id="connText">connecting</span>
      </span>
    </div>
  </header>

  <main>
    <div id="rooms" class="rooms">
      <div class="empty">// loading device state…</div>
    </div>

    <section class="reality-card" aria-label="system reality">
      <span class="footer-label">// system reality</span>
      <p id="realityDevices">All device state below is <strong>simulated</strong>. No physical hardware is connected; sensor values are generated by a server-side loop.</p>
      <p id="realityBroker">Broker status loading…</p>
    </section>
  </main>

  <script>
    const socket = io();
    const state = { devices: {} };

    const roomLabel = (key) => key.replace(/_/g, ' ');

    const fmtNum = (n, digits = 2) => {
      if (n === null || n === undefined || Number.isNaN(n)) return '--';
      return Number(n).toFixed(digits);
    };

    // ============ CONNECTION + INITIAL LOAD ============
    socket.on('connect', () => {
      setConn(true);
      loadDevices();
      loadEnergy();
      loadBrokerStatus();
    });

    socket.on('disconnect', () => setConn(false));

    socket.on('initial_data', (data) => {
      replaceDevices(data.devices || []);
    });

    socket.on('device_update', (device) => {
      state.devices[device.id] = device;
      render();
      loadEnergy();
    });

    socket.on('sensor_update', (data) => {
      (data.devices || []).forEach(d => { state.devices[d.id] = d; });
      render();
    });

    function setConn(connected) {
      const pip = document.getElementById('connPip');
      const text = document.getElementById('connText');
      pip.dataset.state = connected ? 'connected' : 'disconnected';
      text.textContent = connected ? 'connected' : 'disconnected';
    }

    function loadDevices() {
      fetch('/api/devices')
        .then(r => r.json())
        .then(data => {
          if (Array.isArray(data)) replaceDevices(data);
        })
        .catch(() => {});
    }

    function loadEnergy() {
      fetch('/api/energy')
        .then(r => r.json())
        .then(data => {
          // /api/energy returns watts in current_usage
          const kW = (data.current_usage || 0) / 1000;
          document.getElementById('energyValue').textContent = fmtNum(kW, 2);
        })
        .catch(() => {});
    }

    function loadBrokerStatus() {
      fetch('/api/broker/status')
        .then(r => r.json())
        .then(data => updateBroker(data))
        .catch(() => updateBroker({ mode: 'sim', connected: false, enabled: false }));
    }

    function updateBroker(s) {
      const pip = document.getElementById('brokerPip');
      const label = document.getElementById('brokerStatus');
      const reality = document.getElementById('realityBroker');
      const isLive = s.mode === 'live' && s.connected;

      pip.dataset.state = isLive ? 'live' : 'off';
      label.textContent = isLive
        ? `live · ${s.host}`
        : (s.enabled ? `offline · ${s.host || '?'}` : 'offline · sim');

      if (isLive) {
        reality.innerHTML = `Connected to Mosquitto at <strong>${escapeHtml(s.host)}:${s.port}</strong>. Every device mutation publishes to <code class="mono">home/devices/&lt;id&gt;/state</code>, and the app subscribes to <code class="mono">home/devices/+/command</code> for external control — proving the broker round-trip.`;
      } else if (s.enabled) {
        reality.innerHTML = `Broker configured (<strong>${escapeHtml(s.host || '?')}:${s.port || '?'}</strong>) but <strong>not currently connected</strong>. App is running in sim mode; <code class="mono">paho-mqtt</code> will reconnect in the background.`;
      } else {
        reality.innerHTML = `No <strong>MQTT_HOST</strong> configured — app is running in sim mode. Set <code class="mono">MQTT_HOST</code> + <code class="mono">MQTT_PORT</code> env vars (or run the bundled <code class="mono">docker-compose.yml</code>) to wire a real Mosquitto broker and flip this indicator to <code class="mono" style="color:var(--green)">live</code>.`;
      }
    }

    function replaceDevices(list) {
      state.devices = {};
      list.forEach(d => { state.devices[d.id] = d; });
      render();
    }

    // ============ RENDER ============
    function render() {
      const root = document.getElementById('rooms');
      const devices = Object.values(state.devices);

      document.getElementById('deviceCount').textContent = devices.length;

      if (devices.length === 0) {
        root.innerHTML = '<div class="empty">// no devices registered</div>';
        return;
      }

      // Group by room, preserving insertion order
      const grouped = {};
      devices.forEach(d => {
        if (!grouped[d.room]) grouped[d.room] = [];
        grouped[d.room].push(d);
      });

      root.innerHTML = Object.keys(grouped).map(room => {
        const rows = grouped[room];
        const onCount = rows.filter(d => d.status === 'on').length;
        const lightCount = rows.filter(d => d.type === 'light').length;
        const metaParts = [`${rows.length} devices`];
        if (lightCount > 0) metaParts.push(`${onCount}/${lightCount} on`);

        return `
          <section class="room-group">
            <header class="room-header">
              <span class="room-label">// ${roomLabel(room)}</span>
              <span class="room-meta">${metaParts.join(' · ')}</span>
            </header>
            <div class="device-rows">
              ${rows.map(renderRow).join('')}
            </div>
          </section>
        `;
      }).join('');
    }

    function renderRow(d) {
      const pipState = getPipState(d);
      const readout = getReadout(d);
      const control = getControl(d);
      return `
        <div class="device-row" data-type="${d.type}" data-id="${d.id}">
          <span class="pip" data-state="${pipState}"></span>
          <span class="device-name">${escapeHtml(d.name)}</span>
          <span class="device-readout">${readout}</span>
          <div class="device-control">${control}</div>
        </div>
      `;
    }

    function getPipState(d) {
      if (d.type === 'light') return d.status === 'on' ? 'on' : 'off';
      if (d.type === 'sensor') {
        if (d.status === 'motion_detected') return 'motion';
        if (d.status === 'closed') return 'off';
        return 'active';
      }
      if (d.type === 'climate') return d.status;
      return 'off';
    }

    function getReadout(d) {
      if (d.type === 'light') {
        return d.status === 'on'
          ? `<span class="accent-on">on</span> · ${d.value}%`
          : `<span class="accent-off">off</span>`;
      }
      if (d.type === 'sensor') {
        const name = (d.name || '').toLowerCase();
        if (name.includes('temperature')) return `${fmtNum(d.value, 1)} °C`;
        if (name.includes('humidity')) return `${fmtNum(d.value, 1)} %`;
        if (name.includes('motion')) {
          return d.status === 'motion_detected'
            ? `<span class="accent-alert">motion detected</span>`
            : `<span class="accent-off">clear</span>`;
        }
        return `<span class="accent-off">${escapeHtml(d.status)}</span>`;
      }
      if (d.type === 'climate') {
        return `${fmtNum(d.value, 1)} °C · ${escapeHtml(d.status)}`;
      }
      return escapeHtml(d.status);
    }

    function getControl(d) {
      if (d.type === 'light') {
        const isOn = d.status === 'on';
        return `
          <button class="toggle" data-state="${isOn ? 'on' : 'off'}" onclick="toggleDevice(${d.id})">
            ${isOn ? 'ON' : 'OFF'}
          </button>
          <input type="range" min="0" max="100" value="${d.value}" class="slider"
                 oninput="setBrightness(${d.id}, this.value)"
                 aria-label="${escapeAttr(d.name)} brightness" />
        `;
      }
      if (d.type === 'climate') {
        return `
          <input type="range" min="16" max="30" value="${d.value}" class="slider"
                 oninput="setTemperature(${d.id}, this.value)"
                 aria-label="${escapeAttr(d.name)} target temperature" />
        `;
      }
      return '';
    }

    // ============ CONTROLS ============
    function toggleDevice(id) {
      socket.emit('device_control', { device_id: id, action: 'toggle' });
    }

    function setBrightness(id, value) {
      socket.emit('device_control', { device_id: id, action: 'brightness', value: parseInt(value, 10) });
    }

    function setTemperature(id, value) {
      socket.emit('device_control', { device_id: id, action: 'temperature', value: parseFloat(value) });
    }

    // ============ UTIL ============
    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }
    function escapeAttr(s) { return escapeHtml(s); }

    // ============ CLOCK (NY time) ============
    function updateClock() {
      try {
        const t = new Date().toLocaleTimeString('en-US', {
          timeZone: 'America/New_York', hour: '2-digit', minute: '2-digit', hour12: false
        });
        document.getElementById('clock').textContent = t;
      } catch {
        document.getElementById('clock').textContent = '--:--';
      }
    }
    updateClock();
    setInterval(updateClock, 30000);

    // Energy refresh fallback (in case WS lags)
    setInterval(loadEnergy, 15000);

    // Broker status — poll every 15s so disconnects/reconnects surface promptly
    loadBrokerStatus();
    setInterval(loadBrokerStatus, 15000);
  </script>
</body>
</html>
