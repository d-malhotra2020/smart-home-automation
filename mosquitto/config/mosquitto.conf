# Eclipse Mosquitto config for the smart-home operator console.
#
# Defaults: anonymous listener on 1883 for local development. For
# production (Railway sidecar), set MQTT_USERNAME / MQTT_PASSWORD on
# the Flask service and replace `allow_anonymous true` below with a
# password_file directive pointing at a baked-in passwd.

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
